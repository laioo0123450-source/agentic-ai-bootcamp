<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flagged Assets</title>
    <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:hover { background-color: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Flagged Assets for Maintenance</h1>
    <table id="assets-table">
        <thead>
            <tr>
                <th>Asset ID</th>
                <th>Type</th>
                <th>Unit</th>
                <th>Location</th>
                <th>Status</th>
                <th>Criticality</th>
                <th>Last Inspection</th>
                <th>Operating Hours</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function loadFlaggedAssets() {
            try {
                const response = await fetch('/assets?flagged=true');
                const assets = await response.json();
                const tableBody = document.querySelector('#assets-table tbody');
                tableBody.innerHTML = '';
                assets.forEach(asset => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${asset.asset_id}</td>
                        <td>${asset.asset_type}</td>
                        <td>${asset.unit}</td>
                        <td>${asset.location}</td>
                        <td>${asset.status}</td>
                        <td>${asset.criticality}</td>
                        <td>${asset.last_inspection}</td>
                        <td>${asset.operating_hours}</td>
                        <td>${asset.notes || ''}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching flagged assets:', error);
            }
        }

        // Load assets when page loads
        window.addEventListener('DOMContentLoaded', loadFlaggedAssets);
    </script>
</body>
</html>
